# Despliegue de la API de Hannah Store en Render.
# Este archivo asume que el backend esta en la RAIZ del repositorio
# (repo hana-store-back). En el panel: New > Blueprint.

services:
  - type: web
    name: hana-store-back
    runtime: node
    plan: free
    region: oregon

    buildCommand: npm ci --include=dev && npm run build

    # start y start:prod son lo mismo: prisma migrate deploy && node dist/main.
    # `nest start` (el de desarrollo) recompila TypeScript en cada arranque y
    # agota el heap de la instancia gratuita.
    startCommand: npm run start:prod

    healthCheckPath: /api/health

    envVars:
      # Sin fijarlo, Render coge la ultima version que cumpla engines (Node 26).
      - key: NODE_VERSION
        value: "22"

      # Neon. DATABASE_URL usa el pooler; DIRECT_URL es la conexion directa que
      # exigen las migraciones. Ambas terminan en &schema=hannah.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Hannah Store vive en su propio esquema: la base la comparte otro proyecto.
      - key: DB_SCHEMA
        value: hannah

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Dominio del frontend en Vercel, separado por comas si hay varios.
      - key: CORS_ORIGIN
        sync: false

      - key: UPLOADS_DIR
        value: /var/data/uploads

      # Fotos de producto. En el plan free el disco de Render es efimero, asi
      # que las subidas van a Cloudinary: con estas tres variables puestas el
      # backend las sube alli y devuelve una URL absoluta que sobrevive a los
      # despliegues. Se rellenan a mano en el panel (Environment).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
